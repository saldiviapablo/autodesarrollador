name: Onboarding deterministic regression
on:
  push:
    branches:
      - main
      - fix/planner-command-wire-recovery
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  onboarding-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install jsonschema PyYAML
      - name: Create test sandbox
        run: python -c "from pathlib import Path; Path('sandbox').mkdir(exist_ok=True)"
      - name: Verify Python syntax
        run: python -m compileall -q scripts runner tests
      - name: PowerShell parser (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $paths = @('runner/run.ps1', 'runner/research-step.ps1', 'scripts/web-research.ps1', 'runner/plan-objective.ps1', 'scripts/onboarding-repair.ps1', 'tests/ci-onboarding-self-repair.ps1', 'tests/ci-onboarding-self-repair-binding.ps1')
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path (Get-Location).Path $path), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell parse failed: $path : $errors" }
          }
      - name: Windows PowerShell 5.1 self-repair integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/ci-onboarding-self-repair.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: PowerShell 7 self-repair integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/ci-onboarding-self-repair.ps1
      - name: Generate real binding repair fixtures
        if: runner.os == 'Windows'
        run: python tests/ci-generate-self-repair-binding.py
      - name: PowerShell 5.1 repair through canonical Python binding
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/ci-onboarding-self-repair-binding.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Structural planner
        run: python tests/test-onboarding-structural-fix.py
      - name: Approval plan quality replay
        run: python tests/test-onboarding-plan-quality.py
      - name: Command wire recovery
        run: python tests/test-onboarding-command-wire.py
      - name: Windows canonical proposal and binding smoke
        if: runner.os == 'Windows'
        run: python tests/ci-windows-onboarding-binding.py
      - name: Portable compact planner
        run: python tests/ci-portable-compact.py
