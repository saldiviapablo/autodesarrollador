name: Onboarding deterministic regression
on:
  push:
    branches:
      - fix/planner-command-wire-recovery
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  onboarding-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install jsonschema PyYAML
      - name: Create test sandbox
        run: python -c "from pathlib import Path; Path('sandbox').mkdir(exist_ok=True)"
      - name: Verify Python syntax
        run: python -m compileall -q scripts runner tests
      - name: Structural planner
        run: python tests/test-onboarding-structural-fix.py
      - name: Command wire recovery
        run: python tests/test-onboarding-command-wire.py
      - name: Portable compact planner
        run: |
          python tests/test-onboarding-compact.py Compact.test_compact_roundtrip Compact.test_multisource_research_lowers_to_query Compact.test_native_request_caps_and_schema Compact.test_web_policy_matches_plan Compact.test_yaml_duplicate_denied Compact.test_yaml_alias_denied
