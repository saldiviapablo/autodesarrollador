# ==============================================================================
# config/security.yaml — Políticas Globales de Seguridad y Guardrails
# Proyecto: Desarrollador Autónomo
# Versión: 2.0 (Fase 4 — Configuración Central)
# ==============================================================================
# Define las políticas obligatorias de seguridad para ejecuciones autónomas.
# Precedencia: Las políticas de este archivo prevalecen sobre el RUN-CONTRACT,
# las reglas de proyecto y cualquier instrucción o prompt del agente.
# Una capa inferior NUNCA puede hacer más permisiva una regla de este archivo.
# ==============================================================================

workspace:
  allow_write_outside: false
  canonical_path_enforcement: true

git:
  allow_push: false
  allow_force_push: false
  allow_destructive_reset: false
  allow_clean_fdx: false

system:
  allow_admin_runtime: false
  allow_shutdown: false
  allow_restart: false
  allow_registry_changes: false
  allow_firewall_changes: false
  allow_global_execution_policy_changes: false

network:
  llama_public: false
  llama_host: "127.0.0.1"
  allow_port_forwarding: false
  allow_public_tunnels: false

browser:
  dedicated_profile_required: true
  dedicated_profile_name: "HERMES-CHATGPT"
  allow_arbitrary_domains: false

chatgpt:
  enabled: true
  allowed_domain: "chatgpt.com"
  max_queries: 5 # Presupuesto global por run/objetivo (NO por ciclo)
  require_domain_lock: true

autonomy:
  max_cycles: 20
  max_same_failure: 3
  max_no_progress_cycles: 3

secret_policy:
  redact_logs: true
  allow_secrets_in_git: false
  allow_secrets_in_chatgpt: false
  allow_secrets_in_state: false
  allow_secrets_in_memory: false
  sanitize_before_memory_write: true
  redaction_placeholder: "[REDACTED]"

hermes_capabilities:
  memory_truth_level: "LEVEL_2_AUXILIARY"
  skills_can_bypass_guardrails: false
  enforce_pre_tool_hook: true

hooks:
  pre_tool_call:
    path: "scripts/hermes-pre-tool-hook.py"
    sha256: "49a28be99803169841c82b99e48573d966fe26e5a348228417cc94ad46a7573c"
    auto_accept: false
    on_mismatch: "HOOK_INTEGRITY_MISMATCH"

mcp:
  enabled: true
  minimum_surface_policy: true
  allow_dynamic_unapproved_servers: false
  allow_dynamic_unapproved_tools: false
  default_timeout_seconds: 30
  connect_timeout_seconds: 15
  servers:
    da_local_sandbox:
      enabled: true
      transport: "stdio"
      script_path: "scripts/mcp-sandbox-server.py"
      sha256: "ab4c23e4c68dde352c63fbac9bef53dbdb747a411d52fb949d996413b20807c3"
      sandbox_root: "C:\\Users\\Pc\\Documents\\Proyectos Tech\\Desarrollador autonomo\\sandbox\\phase7a2-mcp"
      allowed_tools:
        - "da_echo"
        - "da_read_sandbox"
        - "da_health"
        - "da_slow_test"
      denied_tools:
        - "da_forbidden_test"
      allow_resources: false
      allow_prompts: false
      timeout_seconds: 30
      connect_timeout_seconds: 15

plugins:
  require_sha256_integrity: true
  allow_privilege_escalation: false
  allow_unapproved_plugins: false
  on_mismatch: "PLUGIN_INTEGRITY_MISMATCH"
  approved_plugins:
    desarrollador-autonomo-health:
      enabled: true
      version: "1.0.0"
      repo_dir: "config/plugins/desarrollador-autonomo-health"
      profile_dir: "C:\\Users\\Pc\\AppData\\Local\\hermes\\profiles\\desarrollador-autonomo\\plugins\\desarrollador-autonomo-health"
      entrypoint: "__init__.py"
      sha256: "88516ba97a93fdc30a4eda9dfa72f3316d8e586ea2f664c5827ac10885de011e"
      manifest_sha256: "f4838d484d99006183474da8aa496fc1e148174838f43b98574d4b7e1a100a3c"
      allowed_tools:
        - "da_project_health"
      allowed_hooks:
        - "pre_tool_call"

protected_paths:
  - "C:\\AI\\llama.cpp"
  - "C:\\Users\\Pc\\.cache\\huggingface\\hub\\models--ggml-org--Qwen3.6-35B-A3B-GGUF"
  - "C:\\Users\\Pc\\Documents\\Proyectos Tech\\Desarrollador autonomo\\backups"
  - "C:\\Users\\Pc\\Documents\\Proyectos Tech\\Desarrollador autonomo\\config"
  - "C:\\Users\\Pc\\Documents\\Proyectos Tech\\Desarrollador autonomo\\runner"

blocked_commands:
  patterns:
    - "git push --force"
    - "git push"
    - "git clean -fdx"
    - "git reset --hard"
    - "format"
    - "diskpart"
    - "bcdedit"
    - "reg delete"
    - "shutdown"
    - "Restart-Computer"
    - "Remove-Item C:\\ -Recurse"
    - "del /s /q C:\\"
    - "rd /s /q C:\\"
