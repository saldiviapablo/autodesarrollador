  native_module_sha256: "dc89c75b2a692b8b904a503bfecc6104fccd2501f50513ddf10dc9c53e3bee3f"
  chromium_executable: "C:\\Users\\Pc\\AppData\\Local\\hermes\\tools\\chromium-1208\\chrome-win64\\chrome.exe"
