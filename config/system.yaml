# ==============================================================================
# config/system.yaml — Configuración Central del Sistema
# Proyecto: Desarrollador Autónomo
# Versión: 2.0 (Fase 4 — Configuración Central)
# ==============================================================================
# Fuente central de configuración técnica. Los scripts y herramientas de la
# infraestructura deben consumir estos parámetros en lugar de hardcodear valores.
# No almacenar aquí datos volátiles de runtime (PIDs, tokens, timestamps de runs).
# ==============================================================================

system:
  name: "Desarrollador Autónomo"
  environment: "local"

paths:
  infrastructure_root: "C:\\Users\\Pc\\Documents\\Proyectos Tech\\Desarrollador autonomo"
  ai_base_dir: "C:\\AI"

llama:
  executable: "C:\\AI\\llama.cpp\\llama-server.exe"
  model: "C:\\Users\\Pc\\.cache\\huggingface\\hub\\models--ggml-org--Qwen3.6-35B-A3B-GGUF\\snapshots\\baec3ebee244827cda0f4557eafa8b28f7545fa6\\Qwen3.6-35B-A3B-Q4_K_M.gguf"
  alias: "qwen36"
  host: "127.0.0.1"
  port: 8080
  ctx_size: 65536
  parallel: 1
  cpu_moe: true
  n_gpu_layers: 99
  flash_attention: true
  cache_type_k: "q8_0"
  cache_type_v: "q8_0"
  jinja: true
  health_endpoint: "http://127.0.0.1:8080/health"
  models_endpoint: "http://127.0.0.1:8080/v1/models"
  chat_completions_endpoint: "http://127.0.0.1:8080/v1/chat/completions"
  known_warnings:
    - id: "MMAP_CPU_MOE_TENSOR_OVERRIDE"
      message: "tensor overrides to CPU are used with mmap enabled - consider using --load-mode none for better performance"
      status: "KNOWN_WARNING"
      action: "RETAIN_VALIDATED_DEFAULTS"

runner:
  llama_start_timeout_seconds: 180
  request_timeout_seconds: 60
  global_timeout_minutes: 480
  heartbeat_seconds: 15

inference_lock:
  timeout_seconds: 120
  stale_threshold_seconds: 300

limits:
  max_cycles: 20
  max_same_failure: 3
  max_no_progress_cycles: 3
  max_chatgpt_queries: 5 # Presupuesto global por run/objetivo (NO por ciclo)
  max_llama_restarts: 3
  max_qwen_code_restarts: 3
  max_hermes_restarts: 3

logging:
  level: "INFO"
  retention_days: 14

autopilot:
  directory: ".autopilot"
  checkpoint_interval_minutes: 30

state:
  schema_version: "1.0"

recovery:
  auto_reconcile: true
  checkpoint_interval_minutes: 30

chatgpt:
  profile_name: "HERMES-CHATGPT"
  profile_dir: "C:\\Users\\Pc\\Documents\\Proyectos Tech\\Desarrollador autonomo\\data\\browser\\HERMES-CHATGPT"
  target_url: "https://chatgpt.com"
  max_tabs: 1
  cdp_host: "127.0.0.1"
  cdp_port: 9222
  allowed_domains:
    - "chatgpt.com"
    - "openai.com"
  chrome_executable: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"

qwen_code:
  package: "@qwen-code/qwen-code"
  version: "0.25.1"
  cli_entry: "C:\\Users\\Pc\\AppData\\Roaming\\npm\\node_modules\\@qwen-code\\qwen-code\\cli-entry.js"
  auth_type: "openai"
  default_approval_mode: "plan"
  default_output_format: "json"
  max_wall_time: "300s"

hermes:
  executable: "C:\\Users\\Pc\\AppData\\Local\\hermes\\bin\\hermes.exe"
  version: "0.21.6"
  commit: "818c13be1dc4fd28987e1e881a9408224afd4535"
  profile: "desarrollador-autonomo"
  profile_dir: "C:\\Users\\Pc\\AppData\\Local\\hermes\\profiles\\desarrollador-autonomo"
  default_mode: "oneshot"
  provider: "custom"
  base_url: "http://127.0.0.1:8080/v1"
  model: "qwen36"
  context_length: 65536
  timeout_seconds: 180
  memory:
    enabled: true
    user_profile_enabled: true
    memories_dir: "C:\\Users\\Pc\\AppData\\Local\\hermes\\profiles\\desarrollador-autonomo\\memories"
    memory_file: "C:\\Users\\Pc\\AppData\\Local\\hermes\\profiles\\desarrollador-autonomo\\memories\\MEMORY.md"
    user_file: "C:\\Users\\Pc\\AppData\\Local\\hermes\\profiles\\desarrollador-autonomo\\memories\\USER.md"
    memory_char_limit: 2200
    user_char_limit: 1375
    nudge_interval: 10
    truth_level: "LEVEL_2_AUXILIARY"
    sanitize_secrets_before_write: true
  skills:
    enabled: true
    profile_skills_dir: "C:\\Users\\Pc\\AppData\\Local\\hermes\\profiles\\desarrollador-autonomo\\skills"
    repo_skills_dir: "C:\\Users\\Pc\\Documents\\Proyectos Tech\\Desarrollador autonomo\\config\\skills\\autonomous-dev"
    creation_nudge_interval: 10
    installed_sops:
      - "test-failure-diagnosis"
      - "technical-audit-review"
      - "safe-refactoring"
  hooks:
    auto_accept: true
    pre_tool_call_script: "C:\\Users\\Pc\\Documents\\Proyectos Tech\\Desarrollador autonomo\\scripts\\hermes-pre-tool-hook.py"
    fail_closed: true
