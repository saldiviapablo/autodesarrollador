  provider: "custom"
  base_url: "http://127.0.0.1:8080/v1"
  model: "qwen36"
  context_length: 65536
  timeout_seconds: 180
  memory:
    enabled: true
    user_profile_enabled: true
    memories_dir: "C:\\Users\\Pc\\AppData\\Local\\hermes\\profiles\\desarrollador-autonomo\\memories"
