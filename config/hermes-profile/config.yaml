model:
  default: qwen36
  provider: custom
  base_url: http://127.0.0.1:8080/v1
  context_length: 65536
custom_providers:
  - name: local-qwen
    base_url: http://127.0.0.1:8080/v1
    api_key: local-not-required
    api_mode: chat_completions
    context_length: 65536
    models:
      qwen36:
        context_length: 65536
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
skills:
  creation_nudge_interval: 10
hooks_auto_accept: false
browser:
  backend: "off"
  cloud_provider: local
  engine: chrome
  headed: false
  use_real_profile: false
  allow_private_urls: false
hooks:
  pre_tool_call:
    - command: '"C:/Python314/python.exe" "C:/Users/Pc/Documents/Proyectos Tech/Desarrollador autonomo/scripts/hermes-pre-tool-hook.py"'
      timeout: 30
      fail_closed: true
mcp_single_query_discovery_timeout: 15.0
mcp_servers:
  da_local_sandbox:
    command: "C:/Python314/python.exe"
    args:
      - "C:/Users/Pc/Documents/Proyectos Tech/Desarrollador autonomo/scripts/mcp-sandbox-server.py"
    enabled: true
    trust: full
    timeout: 30
    connect_timeout: 15
    tools:
      include:
        - da_echo
        - da_read_sandbox
        - da_health
        - da_slow_test
      resources: false
      prompts: false
plugins:
  enabled:
    - desarrollador-autonomo-health
  load_timeout_seconds: 10
  hook_callback_timeout: 30
_config_version: 50

